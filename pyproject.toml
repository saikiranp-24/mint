[project]
name = "mint"
version = "0.1.0"
description = "Boilerplate files and directories generator"
requires-python = ">=3.8"
dependencies = [
    "click"
]

[project.scripts]
mint = "mint.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mint"]
include = [
  "src/mint/templates/**/*",
]
