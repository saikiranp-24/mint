[project]
name = "mint"
version = "0.1.0"
description = "Boilerplate files and directories generator"
requires-python = ">=3.8"
dependencies = [
    "click"
]

[project.scripts]
mint = "mint.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
