name: Release workflow for mint

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-on-matrix:
    env:
      ARCHIVE: mint-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}
    name: Build mint on matrix
    strategy:
      matrix:
        include:
          # Linux
          - host: ubuntu-latest
            target: x86_64-unknown-linux-glibc
            archive_ext: tar.gz
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-glibc
            archive_ext: tar.gz

          # macOS
          - host: macos-15-intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - host: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz

          # Windows
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive_ext: zip

    runs-on: ${{ matrix.host }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false

      - name: Install dependencies
        run: |
          uv venv --python 3.14
          uv pip install nuitka

      - name: Build mint
        shell: bash
        run: |
          uv run python -m nuitka \
          --standalone \
          --onefile \
          --lto=yes \
          --enable-plugin=anti-bloat \
          --include-data-dir=./src/mint/templates=templates \
          --assume-yes-for-downloads \
          --remove-output \
          --output-filename=mint \
          ./src/mint/main.py

      - name: Test artifact (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x mint
          ./mint --help

      - name: Test the artifact (Windows)
        if: runner.os == 'Windows'
        run: ./mint.exe --help

      - name: Create archive (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          tar -czvf "${{ env.ARCHIVE }}" mint LICENSE
          sha256sum "${{ env.ARCHIVE }}" > "checksum-${{ matrix.target }}.txt"

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          7z a "${{ env.ARCHIVE }}" mint.exe LICENSE
          sha256sum "${{ env.ARCHIVE }}" > "checksum-${{ matrix.target }}.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ env.ARCHIVE }}
            checksum-${{ matrix.target }}.txt

  build-on-alpine:
    name: Build mint on alpine
    env:
      ARCHIVE: mint-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}
    strategy:
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_ext: tar.gz
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive_ext: tar.gz

    runs-on: ${{ matrix.host }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build inside container
        run: |
          docker run --rm \
          -v .:/workspace -w /workspace \
          ghcr.io/saikiranp-24/mint-alpine-builder:latest \
          bash -c "
            python -m nuitka \
            --standalone \
            --onefile \
            --lto=yes \
            --enable-plugin=anti-bloat \
            --include-data-dir=./src/mint/templates=templates \
            --assume-yes-for-downloads \
            --remove-output \
            --output-filename=mint \
            ./src/mint/main.py \
            && chmod +x mint \
            && ./mint --help
          "

      - name: Create archive
        run: |
          tar -czvf "${{ env.ARCHIVE }}" mint LICENSE
          sha256sum "${{ env.ARCHIVE }}" > "checksum-${{ matrix.target }}.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ env.ARCHIVE }}
            checksum-${{ matrix.target }}.txt

  create-release:
    name: Create GitHub Release
    needs: [build-on-matrix, build-on-alpine]

    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cat checksum-*.txt > sha256sums.txt
          rm checksum-*
          gh release create ${{ github.ref_name }} *

  update-brew-tap:
    name: Update homebrew tap
    needs: [build-on-matrix, build-on-alpine, create-release]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: saikiranp-24/homebrew-tap
          token: ${{ secrets.BREW_TAP_PAT }}

      - name: Update tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          export VERSION="${TAG#v}"

          gh release download "v${VERSION}" --repo ${{ github.repository }} --pattern "sha256sums.txt"

          export LINUX_INTEL_SHA=$(grep x86_64-unknown-linux-glibc sha256sums.txt | awk '{print $1}')
          export LINUX_ARM_SHA=$(grep aarch64-unknown-linux-glibc sha256sums.txt | awk '{print $1}')
          export MAC_INTEL_SHA=$(grep x86_64-apple-darwin sha256sums.txt | awk '{print $1}')
          export MAC_ARM_SHA=$(grep aarch64-apple-darwin sha256sums.txt | awk '{print $1}')

          envsubst < mint.rb.template > Formula/mint.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mint.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update version to ${VERSION}"
          fi
          git push

  update-scoop-bucket:
    name: Update scoop bucket

    needs: [build-on-matrix, build-on-alpine, create-release]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout bucket
        uses: actions/checkout@v7
        with:
          repository: saikiranp-24/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_PAT }}

      - name: Update bucket
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          gh release download "v${VERSION}" --repo ${{ github.repository }} --pattern "sha256sums.txt"

          HASH_AMD64=$(grep x86_64-pc-windows-msvc sha256sums.txt | awk '{print $1}')
          HASH_ARM64=$(grep aarch64-pc-windows-msvc sha256sums.txt | awk '{print $1}')

          jq --arg v "$VERSION" \
            --arg h64 "$HASH_AMD64" \
            --arg harm "$HASH_ARM64" \
            '.version = $v |
              .["architecture"]["64bit"].hash = $h64 |
              .["architecture"]["64bit"].url = "https://github.com/saikiranp-24/mint/releases/download/v\($v)/mint-v\($v)-x86_64-pc-windows-msvc.zip" |
              .["architecture"]["arm64"].hash = $harm |
              .["architecture"]["arm64"].url = "https://github.com/saikiranp-24/mint/releases/download/v\($v)/mint-v\($v)-aarch64-pc-windows-msvc.zip"' \
              mint.json > tmp.json && mv tmp.json mint.json


          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mint.json
          if ! git diff --cached --quiet; then
            git commit -m "Update version to ${VERSION}"
          fi
          git push

  deploy-docs:
    needs: [build-on-matrix, build-on-alpine, create-release]
    name: Deploy docs to GitHub pages
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false

      - name: Install dependencies
        run: |
          uv venv
          uv pip install mkdocs-material

      - name: Deploy to GitHub Pages
        run: uv run mkdocs gh-deploy --force

