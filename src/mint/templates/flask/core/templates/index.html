{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block head %}

<style>
:root {
    --bg: #0f172a;
    --surface: #111827;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #646cff;
    --border: rgba(255, 255, 255, 0.08);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

main {
    width: min(640px, 92vw);
    text-align: center;
    padding: 2rem;
}

h1 {
    margin: 0;
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 700;
    letter-spacing: -0.04em;
}

p {
    margin: 1.5rem auto;
    max-width: 36rem;
    color: var(--muted);
    line-height: 1.7;
    font-size: 1.05rem;
}

.code {
    display: inline-block;
    margin-top: 1rem;
    padding: 0.75rem 1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    color: var(--accent);
    font-size: 0.95rem;
}
</style>

{% endblock %}

{% block content %}

<main>
    <h1>Project generated.</h1>

<p>
    Your application is ready. Start building by editing
    <strong>index.html</strong>.
</p>

<div class="code">
    Edit index.html
</div>

</main>
{% endblock %}
